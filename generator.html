<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gewinnspiel Code-Generator</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #0a192f; /* Dunkelblaues Design */
            user-select: none;
            -webkit-user-select: none;
        }
        .container {
            text-align: center;
            width: 85%;
            max-width: 500px;
            padding: 40px;
            background: #172a45; /* Etwas helleres Dunkelblau für die Box */
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        h1 {
            color: #cbd5e1;
            font-size: 26px;
            margin-bottom: 20px;
            font-weight: 500;
        }
        .code-display {
            font-size: 80px; /* Extra große Anzeige für das iPad */
            font-weight: bold;
            color: #ffffff; /* Weiße Zahlen */
            letter-spacing: 6px;
            margin: 40px 0;
            min-height: 96px;
            text-shadow: 0 4px 12px rgba(255, 255, 255, 0.2);
        }
        .btn {
            background-color: #007aff;
            color: white;
            border: none;
            padding: 22px 40px;
            font-size: 24px;
            font-weight: 600;
            border-radius: 16px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 15px rgba(0, 122, 255, 0.4);
            transition: transform 0.1s, background-color 0.2s;
        }
        .btn:active {
            transform: scale(0.96);
            background-color: #0056b3;
        }
        .info {
            margin-top: 25px;
            font-size: 15px;
            color: #8892b0;
        }
    </style>
</head>
<body>

<div class="container" onclick="generiereCode(event)">
    <h1>Gewinnspiel-Codes</h1>
    <div class="code-display" id="code">0000</div>
    <button class="btn">Code ziehen</button>
    <div class="info" id="info">Tippen Sie, um zu starten.</div>
</div>

<script>
    // Pool mit allen 4-stelligen Zahlen von 1 bis 9999 befüllen
    let codePool = [];
    for (let i = 1; i <= 9999; i++) {
        codePool.push(i);
    }

    let gezogeneCodes = 0;

    function generiereCode(event) {
        // Verhindert doppeltes Auslösen, wenn man direkt den Button trifft
        if (event.target.tagName === 'BUTTON') {
            event.stopPropagation();
        }
        
        if (codePool.length === 0) {
            document.getElementById('code').innerText = "ENDE";
            document.getElementById('info').innerText = "Alle 9.999 Codes wurden aufgebraucht!";
            return;
        }

        // Zufälligen Index aus dem verbleibenden Pool wählen
        const randomIndex = Math.floor(Math.random() * codePool.length);
        
        // Code aus dem Pool entfernen
        const roherCode = codePool.splice(randomIndex, 1)[0];
        gezogeneCodes++;

        // Zahl mit führenden Nullen auf 4 Stellen auffüllen (z.B. 7 -> 0007)
        const formatierterCode = String(roherCode).padStart(4, '0');

        // Code anzeigen
        document.getElementById('code').innerText = formatierterCode;
        document.getElementById('info').innerText = `Gezogen: ${gezogeneCodes} | Verbleibend: ${codePool.length}`;
    }
    
    // Bindet das Event zusätzlich an den Button
    document.querySelector('.btn').addEventListener('click', generiereCode);
</script>

</body>
</html>
