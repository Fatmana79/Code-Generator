<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Gewinnspiel Code-Generator</title>
<style>
    * { box-sizing: border-box; }
    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        background: #0a192f;
        user-select: none;
        -webkit-user-select: none;
        padding: 20px;
    }
    .container {
        text-align: center;
        width: 100%;
        max-width: 500px;
        padding: 45px 30px;
        background: #172a45;
        border-radius: 24px;
        box-shadow: 0 20px 40px rgba(0,0,0,.5);
        border: 1px solid rgba(255,255,255,.1);
    }
    h1 {
        color: #cbd5e1;
        font-size: 28px;
        margin: 0 0 10px;
        font-weight: 500;
    }
    .instruction {
        color: #007aff;
        font-size: 16px;
        font-weight: 600;
        margin-bottom: 25px;
        text-transform: uppercase;
        letter-spacing: 2px;
    }
    .code-display {
        font-size: clamp(64px, 20vw, 96px);
        font-weight: bold;
        color: white;
        letter-spacing: 8px;
        margin: 25px 0;
        min-height: 115px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-shadow: 0 4px 20px rgba(255,255,255,.3);
    }
    .btn {
        width: 100%;
        padding: 20px;
        border: 0;
        border-radius: 16px;
        background: #007aff;
        color: white;
        font-size: 24px;
        font-weight: 600;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
    }
    .btn:active { transform: scale(.98); background: #0056b3; }
    .info {
        margin-top: 20px;
        font-size: 16px;
        color: #8892b0;
    }
</style>
</head>
<body>

<div class="container">
    <h1>Gewinnspiel</h1>
    <div class="instruction">Code ziehen</div>
    <div class="code-display" id="code">0000</div>
    <button class="btn" id="drawButton" type="button">Code ziehen</button>
    <div class="info" id="info">Noch keinen Code gezogen.</div>
</div>

<script>
(function () {
    // Alle Codes 0001 bis 9999, jeder wird höchstens einmal gezogen.
    const codePool = [];
    for (let i = 1; i <= 9999; i++) {
        codePool.push(i);
    }

    let gezogeneCodes = 0;

    function generiereCode() {
        if (codePool.length === 0) {
            document.getElementById("code").textContent = "ENDE";
            document.getElementById("info").textContent = "Alle 9.999 Codes wurden aufgebraucht!";
            document.getElementById("drawButton").disabled = true;
            return;
        }

        const randomIndex = Math.floor(Math.random() * codePool.length);
        const roherCode = codePool.splice(randomIndex, 1)[0];

        gezogeneCodes++;

        const formatierterCode = String(roherCode).padStart(4, "0");
        document.getElementById("code").textContent = formatierterCode;
        document.getElementById("info").textContent =
            "Gezogen: " + gezogeneCodes + " | Verbleibend: " + codePool.length;
    }

    document.getElementById("drawButton").addEventListener("click", generiereCode);
})();
</script>

</body>
</html>
